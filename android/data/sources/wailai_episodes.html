<title>外来媳妇本地郎 · 剧集查询</title>
<style>
:root {
  --vermilion:#A92D22; --gold:#C79A45; --ink:#24160F;
  --paper:#F5EBD5; --paper2:#E9DAB9; --cream:#FFFDF7;
  --jade:#527A68; --dust:#806C55; --border:#D5B986;
  --shadow:rgba(36,22,15,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Noto Serif SC","Source Han Serif CN","SimSun",serif;
  color:var(--ink); min-height:100vh;
  background:
    radial-gradient(ellipse at 15% 0%,rgba(199,154,69,.12),transparent 55%),
    radial-gradient(ellipse at 90% 100%,rgba(169,45,34,.08),transparent 55%),
    var(--paper);
}
.banner{
  background:linear-gradient(135deg,#21130C,#452312 60%,#21130C);
  border-bottom:4px solid var(--gold); position:relative; overflow:hidden;
}
.banner:before{
  content:"";position:absolute;inset:0;opacity:.5;
  background-image:
    linear-gradient(rgba(199,154,69,.09) 1px,transparent 1px),
    linear-gradient(90deg,rgba(199,154,69,.09) 1px,transparent 1px);
  background-size:36px 36px;
}
.banner-inner{max-width:1080px;margin:auto;padding:30px 20px 24px;text-align:center;position:relative}
.deco{font-size:11px;color:var(--gold);letter-spacing:5px;margin-bottom:9px;opacity:.85}
h1{font-size:clamp(28px,6vw,46px);color:#F7EEDB;letter-spacing:.12em;text-shadow:0 2px 12px #000;line-height:1.2}
h1 span{color:var(--gold)}
.sub{margin-top:9px;color:#DCCBA8;font-size:13px;letter-spacing:3px}
.line{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:12px;color:var(--gold)}
.line hr{border:0;border-top:1px solid var(--gold);opacity:.45;width:100px}
.wrap{max-width:1080px;margin:auto;padding:0 20px}
.search{padding-top:26px}
.searchbox{position:relative}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--dust);pointer-events:none}
#search{width:100%;padding:14px 18px 14px 48px;border:2px solid var(--border);border-radius:5px;
  outline:0;background:var(--cream);color:var(--ink);font:16px inherit;box-shadow:inset 0 2px 6px rgba(0,0,0,.05),0 2px 8px var(--shadow)}
#search:focus{border-color:var(--vermilion);box-shadow:0 0 0 3px rgba(169,45,34,.12)}
.hint{font-size:12px;color:var(--dust);margin-top:8px;padding-left:4px}
.notice{margin-top:16px;background:rgba(255,253,247,.72);border:1px solid var(--border);border-left:4px solid var(--jade);
  padding:11px 14px;border-radius:4px;color:var(--dust);font-size:12px;line-height:1.7}
.tabs{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
.tab{padding:6px 13px;font:13px inherit;border:1.5px solid var(--border);border-radius:3px;background:var(--cream);
  color:var(--dust);cursor:pointer;transition:.18s}
.tab:hover{border-color:var(--gold);color:var(--ink);background:var(--paper2)}
.tab.active{background:var(--vermilion);border-color:var(--vermilion);color:white;font-weight:700;box-shadow:0 2px 8px rgba(169,45,34,.28)}
.info{font-size:13px;color:var(--dust);margin:16px 0 10px}
.info strong{color:var(--vermilion)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px;margin-bottom:20px}
.card{background:var(--cream);border:1px solid var(--border);border-radius:5px;box-shadow:0 2px 8px var(--shadow);
  overflow:hidden;position:relative;transition:transform .16s,box-shadow .16s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(36,22,15,.18)}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--vermilion)}
.card-inner{padding:14px 14px 14px 18px;display:flex;gap:13px;align-items:center}
.badge{min-width:68px;padding:7px 7px;background:var(--paper2);border:1px solid var(--border);border-radius:4px;text-align:center;flex-shrink:0}
.badge-sec{font-size:10px;color:var(--dust);margin-bottom:3px}
.badge-num{font-size:14px;font-weight:800;color:var(--vermilion);line-height:1.15}
.badge-type{font-size:9px;color:var(--dust);margin-top:3px}
.info2{min-width:0;flex:1}
.title{font-size:15px;font-weight:700;line-height:1.45;letter-spacing:.04em}
.title mark{background:rgba(199,154,69,.32);border-radius:2px;padding:0 1px}
.range{font-size:11px;color:var(--dust);margin-top:5px}
.raw{font-size:10px;color:#9A8974;margin-top:5px;line-height:1.45}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;margin:22px 0 48px}
.page-btn{border:1px solid var(--border);background:var(--cream);color:var(--ink);padding:7px 13px;border-radius:3px;cursor:pointer;font:13px inherit}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.page-no{font-size:12px;color:var(--dust);min-width:100px;text-align:center}
.empty{display:none;text-align:center;background:var(--cream);border:1px dashed var(--border);padding:48px 20px;border-radius:6px;color:var(--dust);margin:35px 0}
.empty .icon{font-size:34px;margin-bottom:10px}
.empty h3{color:var(--ink);font-size:16px;margin-bottom:6px}
.empty p{font-size:12px;line-height:1.7}
.footer{border-top:1px solid var(--border);text-align:center;padding:20px;color:var(--dust);font-size:12px;letter-spacing:.08em}
@media(max-width:650px){
  .wrap{padding:0 12px} .grid{grid-template-columns:1fr;gap:10px}
  .tabs{gap:5px} .tab{font-size:12px;padding:5px 9px}
  .raw{display:none} .badge{min-width:60px}
}
</style>
</head>

</main>

4,"s":4703,"e":4704,"ep":"4703-4704","title":"西关谍影","raw":"第4703集 西关谍影（上）；第4704集 西关谍影（下）"}];
const PAGE_SIZE = 60;
let season = 0, query = "", page = 1;

const tabs = document.getElementById("tabs");
const search = document.getElementById("search");
const grid = document.getElementById("grid");
const info = document.getElementById("info");
const empty = document.getElementById("empty");
const pager = document.getElementById("pager");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const pageNo = document.getElementById("pageNo");

const all = document.createElement("button");
all.className = "tab active";
all.dataset.s = "0";
all.textContent = "全部";
tabs.appendChild(all);

SECTION_LABELS.forEach((label, i) => {
  const b = document.createElement("button");
  b.className = "tab";
  b.dataset.s = String(i + 1);
  b.textContent = label.split(":")[0].split("：")[0];
  tabs.appendChild(b);
});

tabs.addEventListener("click", e => {
  const b = e.target.closest(".tab");
  if (!b) return;
  tabs.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  season = Number(b.dataset.s);
  page = 1;
  render();
});

search.addEventListener("input", e => {
  query = e.target.value.trim();
  page = 1;
  render();
});
prev.addEventListener("click", () => { if(page > 1){page--; render(); window.scrollTo({top:300,behavior:"smooth"});} });
next.addEventListener("click", () => { page++; render(); window.scrollTo({top:300,behavior:"smooth"}); });

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
                  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function reEsc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function highlight(s, q) {
  const safe = esc(s);
  if(!q) return safe;
  try {
    return safe.replace(new RegExp("(" + reEsc(q) + ")", "gi"), "<mark>$1</mark>");
  } catch(e) { return safe; }
}

function render() {
  const q = query.toLowerCase();
  const numeric = /^\d+$/.test(q);
  const num = numeric ? Number(q) : null;

  const filtered = DATA.filter(d => {
    if(season && d.section !== season) return false;
    if(!q) return true;
    if(numeric) return num >= d.s && num <= d.e;
    return d.title.toLowerCase().includes(q) || d.raw.toLowerCase().includes(q);
  });

  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if(page > totalPages) page = totalPages;
  const start = (page - 1) * PAGE_SIZE;
  const shown = filtered.slice(start, start + PAGE_SIZE);

  if(!filtered.length) {
    grid.innerHTML = "";
    empty.style.display = "block";
    info.innerHTML = "";
    pager.style.display = "none";
    return;
  }
  empty.style.display = "none";
  pager.style.display = "flex";

  info.innerHTML = `共找到 <strong>${filtered.length}</strong> 个故事卡片` +
    (q ? `，搜索：<strong>${esc(query)}</strong>` : "") +
    (season ? `，范围：<strong>${esc(SECTION_LABELS[season-1].split("（")[0])}</strong>` : "");

  grid.innerHTML = shown.map(d => {
    const merged = d.s !== d.e;
    const title = highlight(d.title, numeric ? "" : query);
    const secText = d.section ? `第${d.section}部` : "未分部";
    return `<article class="card">
      <div class="card-inner">
        <div class="badge">
          <div class="badge-sec">${secText}</div>
          <div class="badge-num">${esc(d.ep)}</div>
          <div class="badge-type">${merged ? "故事合集" : "单集"}</div>
        </div>
        <div class="info2">
          <div class="title">${title}</div>
          <div class="range">第${d.s === d.e ? d.s + "集" : d.s + "–" + d.e + "集"}</div>
          <div class="raw">${esc(d.raw)}</div>
        </div>
      </div>
    </article>`;
  }).join("");

  pageNo.textContent = `第 ${page} / ${totalPages} 页`;
  prev.disabled = page <= 1;
  next.disabled = page >= totalPages;
}

render();
</script>
