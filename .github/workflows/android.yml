name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
    tags: ['android-v*']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    name: Assemble and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Cache keyed on the android project's wrapper properties.
          cache-read-only: false

      - name: Verify the datasets reproduce from the committed pages
        run: |
          node tools/verify_qiershi.js
          # Rebuild every generated artefact and fail if it differs from what is committed.
          rm -rf data/extracted app/src/main/assets
          node tools/extract_data.js
          node tools/extract_qiershi.js
          node tools/build_asset.js
          node tools/verify_qiershi.js
          git diff --exit-code -- data/extracted app/src/main/assets

      - name: Unit tests
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
